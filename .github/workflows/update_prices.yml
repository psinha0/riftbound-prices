name: Update Card Prices

on:
  schedule:
    - cron: '23 1 * * *'   # 01:23 UTC daily — off-peak to spread load
  workflow_dispatch:        # allow manual run from GitHub Actions tab

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit prices.json back to repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run price update script
        env:
          TCGGO_API_KEY: ${{ secrets.TCGGO_API_KEY }}
        run: python scripts/update_prices.py

      - name: Commit updated prices
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add docs/prices.json
          git diff --staged --quiet || git commit -m "chore: update card prices $(date -u +%Y-%m-%d)"
          git push
